  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Velmora Vendor">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- Firebase SDKs - Using older stable version for better compatibility -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-messaging-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-analytics-compat.js"></script>

  <script>
    // Your web app's Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCT7twkCGudSOiePsgsSlsDZgWKHT3gxG8",
      authDomain: "full-stack-app-92e61.firebaseapp.com",
      projectId: "full-stack-app-92e61",
      storageBucket: "full-stack-app-92e61.firebasestorage.app",
      messagingSenderId: "33258933921",
      appId: "1:33258933921:web:ebf26cb174cc3f4f7ceae0",
      measurementId: "G-ZEBW21S3KF"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);

    // Initialize Analytics
    firebase.analytics();

    // Initialize Messaging
    const messaging = firebase.messaging();

    // Request notification permission and get token
    async function initializeFCM() {
      try {
        // Request permission
        const permission = await Notification.requestPermission();
        console.log('Notification permission:', permission);

        if (permission === 'granted') {
          // Get FCM token
          const token = await messaging.getToken({
            vapidKey: 'BGgbsIfoewRAqUEXIU7UFbgdWig__lVBmcf6oBNQrHWzSgGefNPT5wwLLE6gxgSd2RnfqMOwPJV-nh5JMCxICRI' // Optional, but recommended for production
          });
          console.log('✅ Web FCM Token:', token);

          // Store token globally for Flutter to access
          window._fcmToken = token;

          // Also store in localStorage for persistence
          localStorage.setItem('web_fcm_token', token);
        } else {
          console.log('⚠️ Notification permission denied');
        }
      } catch (error) {
        console.error('❌ FCM initialization error:', error);
      }
    }

    // Handle foreground messages
    messaging.onMessage((payload) => {
      console.log('📨 Foreground message received:', payload);

      // Show browser notification even when app is open
      if (Notification.permission === 'granted') {
        const notification = new Notification(payload.notification.title, {
          body: payload.notification.body,
          icon: payload.notification.icon || '/favicon.png',
          data: payload.data
        });

        notification.onclick = function (event) {
          event.preventDefault();
          window.focus();
          // Handle navigation based on data
          if (payload.data && payload.data.orderId) {
            // You can navigate to order details
            console.log('Navigate to order:', payload.data.orderId);
          }
        };
      }
    });

    // Call initialization when page loads
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initializeFCM);
    } else {
      initializeFCM();
    }

    // Service Worker registration for background messages
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/firebase-messaging-sw.js')
        .then((registration) => {
          console.log('✅ Service Worker registered with scope:', registration.scope);
        })
        .catch((err) => {
          console.log('❌ Service Worker registration failed:', err);
        });
    }
  </script>

  <title>Velmora Vendor</title>
  <link rel="manifest" href="manifest.json">
